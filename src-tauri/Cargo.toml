[package]
name = "frame"
version = "1.6.7"
description = "Sistema Operativo de Productividad"
authors = ["VT Asvent <vt.asvent@gmail.com>"]
edition = "2021"

[lib]
name = "frame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" habilita webviews hijos (multiwebview): necesario para incrustar
# la interfaz REAL de Gmail como un recuadro dentro de la ventana principal.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# La misma versión que usa el actualizador: una sola copia en el binario.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls-no-provider"] }
# Proveedor criptográfico de rustls: el `ring` que el actualizador ya trae.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
base64 = "0.22"
# Explorador de archivos de Windows para «Importar» en Música.
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
# «Pegar» del menú propio de los campos de texto: lee el portapapeles.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[profile.release]
# Binario mínimo: casi todo el trabajo nativo es de entrada y salida (archivos,
# red), así que optimizar por tamaño ("z") no se nota en velocidad.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
