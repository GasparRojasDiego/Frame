[package]
name = "frame"
version = "1.6.5"
description = "Sistema Operativo de Productividad"
authors = ["VT Asvent <vt.asvent@gmail.com>"]
edition = "2021"

[lib]
name = "frame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" habilita webviews hijos (multiwebview): necesario para incrustar
# la interfaz REAL de Gmail como un recuadro dentro de la ventana principal.
tauri = { version = "2", features = ["tray-icon", "image-ico", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
# Explorador de archivos de Windows para «Importar» en Música.
rfd = "0.15"

[profile.release]
# Binario mínimo y rápido: optimización agresiva para distribución.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
